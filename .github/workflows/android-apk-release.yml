name: Build & Publish Signed APK Release

on:
  push:
    branches:
      - main
      - master
      - "release/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-apk:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Configure Android SDK & Accept Licenses
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
          else
            mkdir -p "$ANDROID_HOME/licenses"
            printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
            printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare Environment (.env) & Release Signing Keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi

          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${STORE_PASSWORD}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storepass avpn_release_pass \
              -alias upload \
              -keypass avpn_release_pass \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=A VPN,OU=Ashir,O=AVPN,C=US"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=avpn_release_pass" >> $GITHUB_ENV
            echo "KEY_PASSWORD=avpn_release_pass" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK Only
        run: |
          gradle :app:assembleRelease --no-daemon

      - name: Package Signed APK & Generate Release Notes
        id: meta
        run: |
          mkdir -p release-assets

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")

          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          RELEASE_APK_OUT="release-assets/AVPN-${VERSION_TAG}-signed.apk"
          cp app/build/outputs/apk/release/app-release.apk "${RELEASE_APK_OUT}"

          REL_SIZE=$(du -h "${RELEASE_APK_OUT}" | cut -f1)
          REL_SHA256=$(sha256sum "${RELEASE_APK_OUT}" | awk '{print $1}')

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (\`%h\`)" --no-merges)
          else
            CHANGELOG=$(git log -n 10 --pretty=format:"- %s (\`%h\`)" --no-merges)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Automated signed APK release from commit \`${SHORT_SHA}\`"
          fi

          cat <<EOF > RELEASE_NOTES.md
          ## 🔥 A VPN — Release \`${VERSION_TAG}\`

          **Made with love by Ashir ♥️**

          | File | Size | SHA-256 |
          | :--- | :--- | :--- |
          | **\`AVPN-${VERSION_TAG}-signed.apk\`** | **${REL_SIZE}** | \`${REL_SHA256}\` |

          - **Build Date:** \`${BUILD_DATE}\`
          - **Android Compatibility:** Android 8.0 – Android 16+

          ### What's New
          ${CHANGELOG}
          EOF

      - name: Create GitHub Release (Signed APK Only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version_tag }}
          name: "A VPN ${{ steps.meta.outputs.version_tag }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: "true"
          files: |
            release-assets/AVPN-${{ steps.meta.outputs.version_tag }}-signed.apk
